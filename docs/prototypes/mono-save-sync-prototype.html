  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&display=swap');
    :root{--bg:#001b19;--panel:#062722;--panel2:#082e27;--line:#14453b;--ink:#edf7ee;--muted:#8ca9a0;--acid:#cfff55;--mint:#6ee0c6;--blue:#6ab7db;--warn:#ffc968;--danger:#ff8e7d;--shadow:0 22px 70px #000b}
    *{box-sizing:border-box}html{background:#00110f}body{margin:0;min-height:100vh;color:var(--ink);font-family:'Noto Sans SC','Segoe UI',sans-serif;background:radial-gradient(circle at 83% -5%,#21614d55,transparent 28%),radial-gradient(circle at 0 100%,#063b3266,transparent 35%),var(--bg)}
    button{font:inherit;cursor:pointer}.mono{font:10px 'DM Mono',monospace;letter-spacing:-.02em}.app{width:min(100%,520px);min-height:100vh;margin:0 auto;padding:28px 20px 65px;position:relative}.topbar{display:flex;align-items:center;gap:12px}.brand{font-weight:700;font-size:14px;letter-spacing:.16em;flex:1}.brand span{color:var(--acid)}.top-button{border:1px solid transparent;background:#14372f;color:var(--muted);border-radius:3px;padding:8px 18px;font-size:10px}.top-button:hover{color:var(--ink);border-color:var(--line)}.top-button.primary{background:var(--acid);color:#102019;border-color:var(--acid);font-weight:700}
    .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:25px 3px 28px}.tab{border:1px solid transparent;border-radius:3px;background:#092c25;color:#708f86;padding:8px 4px;font-size:10px;white-space:nowrap}.tab:hover,.tab.active{background:#123d32;color:var(--acid);border-color:#205448}.tab.active{box-shadow:inset 0 -2px var(--acid)}
    .page{display:none}.page.active{display:block;animation:enter .22s ease}@keyframes enter{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
    .save-hero{min-height:119px;display:grid;grid-template-columns:85px 1fr 84px;gap:10px;align-items:center;margin-bottom:12px}.save-art{height:90px;display:grid;place-items:center}.save-art img{max-width:82px;max-height:82px;image-rendering:auto;filter:drop-shadow(0 8px 10px #000b)}.save-copy h1{font-size:19px;letter-spacing:-.06em;margin:0}.save-copy .file{margin-top:5px;color:var(--acid);font:12px 'DM Mono'}.save-copy p{margin:5px 0 0;color:var(--muted);font-size:9px;line-height:1.55}.save-orb{height:67px;width:67px;justify-self:end;border:1px solid #6cd4bd99;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 34% 25%,#489a8666,transparent 37%),#0a3c34;box-shadow:0 0 0 4px #071f1b,0 0 16px #91e5ca44}.save-orb:before{content:'↕';font:25px 'DM Mono';color:var(--mint)}
    .remote-card{border:1px solid var(--line);border-radius:9px;background:linear-gradient(135deg,#0a3028,#06231f);padding:12px;margin:0 0 21px}.remote-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.remote-head h2{font-size:14px;margin:0;letter-spacing:-.04em}.remote-head small{color:var(--muted);font:9px 'DM Mono'}.remote-status{font-size:9px;border-radius:99px;padding:4px 7px;background:#163d32;color:var(--mint)}.remote-status.diff{background:#4b391e;color:var(--warn)}.remote-status.local-newer{background:#21434a;color:#93e8f3}.remote-path{display:flex;align-items:center;gap:7px;color:var(--muted);font:9px 'DM Mono';margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.remote-path b{color:var(--ink);font-weight:400;overflow:hidden;text-overflow:ellipsis}.remote-compare{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}.remote-version{padding:8px 9px;border:1px solid #174c40;border-radius:6px;background:#061f1b}.remote-version span{display:block;color:var(--muted);font-size:9px}.remote-version strong{display:block;margin-top:3px;font:12px 'DM Mono';color:var(--ink)}.remote-version small{display:block;margin-top:3px;color:var(--muted);font-size:8px}.remote-actions{display:flex;gap:7px;margin-top:11px}.remote-actions button{flex:1;border:1px solid #2d6957;background:#0d3a30;color:var(--ink);border-radius:4px;padding:8px 7px;font-size:10px}.remote-actions button:hover{border-color:var(--mint);color:var(--acid)}.remote-actions .pull{background:var(--acid);color:#102019;border-color:var(--acid);font-weight:700}.remote-actions .pull:hover{color:#102019}.remote-note{margin:9px 0 0;color:#77988d;font-size:9px;line-height:1.45}.sync-entry{width:100%;display:flex;align-items:center;gap:10px;margin:0 0 21px;padding:10px 12px;border:1px solid var(--line);border-radius:7px;background:#062a23;color:var(--ink);text-align:left}.sync-entry:hover{border-color:var(--mint);background:#0a352c}.sync-entry-icon{font:18px 'DM Mono';color:var(--mint)}.sync-entry-copy{flex:1}.sync-entry-copy b{display:block;font-size:11px}.sync-entry-copy small{display:block;margin-top:3px;color:var(--muted);font:9px 'DM Mono'}.sync-entry .remote-status{flex:none}.sync-entry-arrow{color:var(--muted);font:20px 'DM Mono'}.sync-modal-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}.sync-modal-file{font:12px 'DM Mono';color:var(--acid)}.sync-modal-source{margin-top:4px;color:var(--muted);font:9px 'DM Mono'}
    .section-title{display:flex;align-items:end;justify-content:space-between;gap:8px;margin:0 0 9px}.section-title h2{margin:0;font-size:16px;letter-spacing:-.05em}.section-title p{margin:3px 0 0;color:var(--muted);font-size:9px}.section-title .mono{color:var(--muted)}
    .warehouse{border:1px solid var(--line);border-radius:10px;background:#041f1a;padding:10px}.warehouse-head{display:grid;grid-template-columns:37px 1fr 37px;align-items:center;gap:6px;margin-bottom:10px}.warehouse-head button{height:36px;border:0;border-radius:2px;background:#0a342b;color:var(--mint);font:23px 'DM Mono'}.warehouse-head button:hover{color:var(--acid);background:#124338}.box-name{text-align:center}.box-name b{display:block;font-size:11px;font-weight:500}.box-name small{display:block;color:var(--muted);font:9px 'DM Mono';margin-top:3px}.slot-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}.slot{position:relative;aspect-ratio:1;border:1px solid #145044;border-radius:3px;background:#002d25;display:grid;place-items:center;padding:5px;transition:.15s}.slot:hover,.slot.selected{border-color:var(--acid);background:#0c4235}.slot.selected{box-shadow:inset 0 0 0 1px var(--acid)}.slot img{max-width:90%;max-height:90%;filter:drop-shadow(0 5px 5px #0008)}.slot.empty{border-style:dashed;color:#1b5549;font:9px 'DM Mono'}.slot-mark{position:absolute;right:3px;top:3px;width:13px;height:13px;border-radius:50%;background:var(--acid);color:#102019;display:grid;place-items:center;font:9px 'DM Mono'}
    .warehouse-action{display:flex;gap:7px;align-items:center;margin-top:10px;padding:9px 10px;border-radius:7px;background:#0b342b;border:1px solid #145044}.warehouse-action span{flex:1;color:var(--muted);font-size:10px}.warehouse-action b{color:var(--acid)}.warehouse-action button{border:1px solid var(--acid);border-radius:4px;background:var(--acid);color:#102019;padding:8px 10px;font-size:10px;font-weight:700}
    .home-page{padding-top:2px}.home-card{border:1px solid var(--line);border-radius:10px;background:#06251f;padding:17px;margin-top:6px}.home-card h1{font-size:19px;margin:0 0 6px}.home-card p{font-size:10px;line-height:1.65;color:var(--muted);margin:0}.home-list{display:grid;gap:8px;margin-top:17px}.home-item{display:flex;align-items:center;gap:10px;border:1px solid #145044;border-radius:7px;padding:10px;background:#082e27}.home-item .home-icon{width:34px;height:34px;display:grid;place-items:center;border-radius:6px;background:#103c31;color:var(--acid);font-size:17px}.home-item b{font-size:11px}.home-item small{display:block;margin-top:3px;color:var(--muted);font:9px 'DM Mono'}.home-item span{margin-left:auto;color:var(--mint);font-size:9px}
    .history-list{display:grid;gap:8px;margin-top:12px}.history-item{border:1px solid var(--line);border-radius:7px;padding:10px;background:#072a23;display:flex;align-items:center;gap:9px;cursor:pointer}.history-item:hover,.history-item.selected{border-color:var(--acid);background:#0d3c31}.history-dot{width:10px;height:10px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 4px #6ee0c61e}.history-item b{font-size:11px}.history-item small{display:block;color:var(--muted);font:9px 'DM Mono';margin-top:3px}.history-item strong{margin-left:auto;color:var(--acid);font:10px 'DM Mono'}.settings-box{border:1px solid #165044;border-radius:8px;background:#05231e;padding:12px;margin-top:14px}.settings-box b{display:block;font-size:12px}.settings-box small{display:block;margin-top:5px;color:var(--muted);font:9px 'DM Mono';line-height:1.5}.settings-choice{width:100%;display:block;text-align:left;border:1px solid #25604f;border-radius:6px;background:#0d3a30;color:var(--ink);padding:11px;margin-top:9px}.settings-choice:hover{border-color:var(--acid)}.settings-choice b{font-size:11px}.settings-choice small{margin-top:3px}.settings-choice.primary{background:var(--acid);color:#102019;border-color:var(--acid)}.settings-choice.primary small{color:#29442b}.settings-foot{margin-top:12px;color:var(--muted);font-size:10px;line-height:1.5}
    .modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;padding:0;z-index:10}.modal.open{display:flex}.modal-box{width:min(520px,100%);background:#082b24;border:1px solid var(--line);border-bottom:0;border-radius:15px 15px 0 0;padding:20px;box-shadow:0 -22px 60px #000b;animation:sheet .2s ease}.modal-box h2{font-size:20px;letter-spacing:-.06em;margin:6px 0}.modal-box p{color:var(--muted);font-size:11px;line-height:1.6;margin:0}.modal-eyebrow{color:var(--acid);font:10px 'DM Mono';letter-spacing:.14em}.modal-summary{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:15px 0}.modal-summary article{border:1px solid #165044;border-radius:7px;padding:10px;background:#05231e}.modal-summary span{display:block;color:var(--muted);font-size:9px}.modal-summary b{display:block;color:var(--ink);font:12px 'DM Mono';margin-top:5px}.modal-actions{display:flex;gap:8px;margin-top:18px}.modal-actions button{flex:1;border:1px solid #25604f;border-radius:5px;background:#0e3b30;color:var(--ink);padding:11px;font-size:11px}.modal-actions button.primary{background:var(--acid);border-color:var(--acid);color:#102019;font-weight:700}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;background:var(--acid);color:#102019;border-radius:5px;padding:10px 13px;font-size:11px;font-weight:700;z-index:20;transition:.2s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}@keyframes sheet{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
    @media(min-width:600px){body{padding:20px 0}.app{border:1px solid #0b3b32;border-radius:12px;box-shadow:var(--shadow);background:var(--bg);padding-left:25px;padding-right:25px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar"><div class="brand">MONO <span>/</span> HOME</div><button class="top-button" data-action="settings">设置</button><button class="top-button primary" data-action="import">＋ 导入存档</button></header>
    <nav class="tabs"><button class="tab" data-tab="warehouse">◇ 主仓库</button><button class="tab active" data-tab="emerald">◇ 绿宝石</button><button class="tab" data-tab="heartgold">✦ 心金 / 魂银</button></nav>

    <section class="page active" id="savePage">
      <div class="save-hero"><div class="save-art"><img id="saveArt" src="../../src/MonoHome.Android/Resources/drawable/a_384.png" alt="当前游戏图标"></div><div class="save-copy"><h1 id="saveName">绿宝石</h1><div class="file" id="saveFile">emerald.srm</div><p id="saveSummary">绿宝石 · 仅管理此存档的队伍与盒子</p></div><div class="save-orb" aria-label="远程同步"></div></div>
      <button class="sync-entry" data-action="sync"><span class="sync-entry-icon">↕</span><span class="sync-entry-copy"><b>存档同步</b><small id="syncSummary">远端最新 v15 · 共 6 个版本</small></span><span class="remote-status diff" id="syncStatus">本地较旧</span><span class="sync-entry-arrow">›</span></button>
      <div class="section-title"><div><h2>上传仓库</h2><p id="warehouseHint">按游戏存档来源选择可上传宝可梦，点击图标查看详情并加入上传</p></div><span class="mono" id="boxCount">30 / 30 槽位</span></div>
      <section class="warehouse"><div class="warehouse-head"><button data-box="prev" aria-label="上一个盒子">‹</button><div class="box-name"><b id="boxName">仓库 1</b><small id="boxIndex">当前存档 · 盒子 1</small></div><button data-box="next" aria-label="下一个盒子">›</button></div><div class="slot-grid" id="slotGrid"></div></section><div class="warehouse-action"><span id="selectedText">点击宝可梦选择上传</span><button data-action="uploadPokemon">上传至中央仓库</button></div>
    </section>

    <section class="page home-page" id="warehousePage"><div class="home-card"><div class="modal-eyebrow">CENTRAL WAREHOUSE</div><h1>主仓库</h1><p>这里管理从不同游戏存档上传的宝可梦副本。远程备份属于具体游戏存档，不属于主仓库。</p><div class="home-list"><div class="home-item"><div class="home-icon">◇</div><div><b>绿宝石来源</b><small>emerald.srm · 12 个副本</small></div><span>本地</span></div><div class="home-item"><div class="home-icon">✦</div><div><b>心金 / 魂银来源</b><small>heartgold.sav · 8 个副本</small></div><span>本地</span></div></div></div><div class="section-title" style="margin-top:25px"><div><h2>说明</h2><p>同步器只备份游戏存档文件，不上传中央仓库实体</p></div></div></section>
  </main>
  <div class="modal" id="modal"><div class="modal-box" id="modalBox"></div></div><div class="toast" id="toast"></div>
  <script>
    const root='../../src/MonoHome.Android/Resources/drawable/a_';
    const saves={emerald:{name:'绿宝石',file:'emerald.srm',icon:384,summary:'绿宝石 · 仅管理此存档的队伍与盒子',path:'pokemon/emerald.sav',local:{v:12,device:'Windows PC',time:'今天 21:14',ts:2114,hash:'a91f2c7'},remote:{v:15,device:'Android 手机',time:'今天 20:47',ts:2047,hash:'c08bd19'},mons:[25,264,35,268,169,310,74,293,41,129,130,133,147,148,149,150,151,152,153,154,155,156,157,158,159,160,161,162,163,164]},heartgold:{name:'心金 / 魂银',file:'heartgold.sav',icon:250,summary:'心金 / 魂银 · 仅管理此存档的队伍与盒子',path:'pokemon/heartgold.sav',local:{v:8,device:'Android 手机',time:'昨天 18:06',ts:1806,hash:'7c21a8e'},remote:{v:8,device:'Android 手机',time:'昨天 18:06',ts:1806,hash:'7c21a8e'},mons:[200,214,197,170,133,144,54,74,79,100,101,104,105,106,107,108,109,110,111,112,113,114,115,116,117,118,119,120,121,122]}};
    const history={emerald:[{v:15,d:'Android 手机',t:'今天 20:47',ts:2047,h:'c08bd19',n:'通关后保存'},{v:14,d:'Android 手机',t:'今天 18:02',ts:1802,h:'b70a91d',n:'整理队伍'},{v:13,d:'Windows PC',t:'今天 16:33',ts:1633,h:'0fe83aa',n:'进入冠军之路'},{v:12,d:'Windows PC',t:'今天 21:14',ts:2114,h:'a91f2c7',n:'本机当前版本'},{v:11,d:'Windows PC',t:'昨天 22:51',ts:2251,h:'912a0f1',n:'道馆前'},{v:10,d:'Android 手机',t:'昨天 20:09',ts:2009,h:'44eaa80',n:'初次备份'}],heartgold:[{v:8,d:'Android 手机',t:'昨天 18:06',ts:1806,h:'7c21a8e',n:'本地与远端一致'},{v:7,d:'Windows PC',t:'昨天 12:21',ts:1221,h:'2c8d1f0',n:'换机前备份'}]};
    let active='emerald', box=1, selected=new Set(), chosenRemote=null;const branchBase={emerald:null,heartgold:null};
    const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    function save(){return saves[active]}function icon(id){return `${root}${id}.png`}
    function render(){const s=save();$('#saveArt').src=icon(s.icon);$('#saveName').textContent=s.name;$('#saveFile').textContent=s.file;$('#saveSummary').textContent=s.summary;const same=s.local.hash===s.remote.hash,localNewer=!same&&s.local.ts>s.remote.ts,label=same?'已同步':localNewer?'本地较新':'本地较旧';$('#syncStatus').textContent=label;$('#syncStatus').className='remote-status '+(same?'':localNewer?'local-newer':'diff');$('#syncSummary').textContent=`远端最新 v${s.remote.v} · 共 ${(history[active]||[]).length} 个版本`;$('#boxIndex').textContent=`${s.name} · 盒子 ${box}`;$('#boxName').textContent=`仓库 ${box}`;$('#boxCount').textContent=`${s.mons.length} / 30 槽位`;const slots=Array.from({length:30},(_,i)=>{const id=s.mons[(box-1)*30+i];return id?`<button class="slot ${selected.has(i)?'selected':''}" data-slot="${i}" aria-label="宝可梦 #${id}"><img src="${icon(id)}" alt="宝可梦 #${id}">${selected.has(i)?'<i class="slot-mark">✓</i>':''}</button>`:`<span class="slot empty">${String(i+1).padStart(2,'0')}</span>`}).join('');$('#slotGrid').innerHTML=slots;document.querySelectorAll('[data-slot]').forEach(el=>el.onclick=()=>{const i=+el.dataset.slot;selected.has(i)?selected.delete(i):selected.add(i);render()});$('#selectedText').innerHTML=selected.size?`已选 <b>${selected.size}</b> 只宝可梦`:'点击宝可梦选择上传'}
    function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2300)}function close(){$('#modal').classList.remove('open')}function modal(html){$('#modalBox').innerHTML=html;$('#modal').classList.add('open')}
    function sync(){const s=save(),same=s.local.hash===s.remote.hash,localNewer=!same&&s.local.ts>s.remote.ts,status=same?'已同步':localNewer?'本地较新':'本地较旧',statusClass=same?'':localNewer?'local-newer':'diff';modal(`<div class="modal-eyebrow">SAVE SYNC</div><div class="sync-modal-top"><div class="sync-modal-file">${s.file}</div><span class="remote-status ${statusClass}">${status}</span></div><div class="sync-modal-source">GitHub · mono-home-saves / ${active}</div><div class="remote-path">当前文件：<b>${s.path}</b></div><div class="remote-compare"><article class="remote-version"><span>本地版本</span><strong>v${s.local.v}</strong><small>${s.local.device} · ${s.local.time}</small></article><article class="remote-version"><span>远端最新版本</span><strong>v${s.remote.v}</strong><small>${s.remote.device} · ${s.remote.time} · 共 ${(history[active]||[]).length} 个版本</small></article></div><div class="remote-actions"><button data-action="upload">↑ 上传本地</button><button class="pull" data-action="pull">↓ 拉取远端</button></div><p class="remote-note">远端保留多个存档版本；默认使用最新版本，需要回滚时可在“拉取远端”里选择其他版本。</p><div class="modal-actions"><button class="primary" data-close>完成</button></div>`)}
    function settings(){modal(`<div class="modal-eyebrow">REPOSITORY</div><h2>存档仓库</h2><p>每个用户绑定自己的 GitHub 私有仓库，应用不会共用开发者的仓库。</p><div class="settings-box"><b>我的 GitHub 仓库</b><small>GitHub · 你的账号 / mono-home-saves<br>私有 · 已初始化 · emerald、heartgold</small></div><button class="settings-choice primary" data-action="rebind"><b>更换或初始化仓库</b><small>连接 GitHub 后创建你的专用仓库，或绑定已有仓库</small></button><p class="settings-foot">绑定完成后，其他设备只需登录同一个 GitHub 账号并选择这个仓库即可继续使用。</p><div class="modal-actions"><button class="primary" data-close>完成</button></div>`)}
    function rebind(){modal(`<div class="modal-eyebrow">FIRST-TIME SETUP</div><h2>绑定你的存档仓库</h2><p>先授权 GitHub，再选择创建或绑定仓库。仓库初始化只需完成一次。</p><button class="settings-choice primary" data-action="createRepo"><b>连接 GitHub 并创建专用仓库</b><small>自动创建私有 mono-home-saves 并写入存档目录</small></button><button class="settings-choice" data-action="bindRepo"><b>绑定已有仓库</b><small>适合已经在其他设备初始化过的用户</small></button><div class="modal-actions"><button data-close>取消</button></div>`)}
    function finishBinding(mode){modal(`<div class="modal-eyebrow">REPOSITORY READY</div><h2>仓库已${mode}</h2><p>之后上传和拉取都会持续使用这个仓库；换设备时登录同一个 GitHub 账号即可继续。</p><div class="settings-box"><b>mono-home-saves</b><small>私有 · 已绑定当前应用 · 存档按游戏文件分别保存</small></div><div class="modal-actions"><button class="primary" data-close>完成</button></div>`)}
    function upload(){const s=save();if(s.local.hash===s.remote.hash){toast(`${s.name}本地与远端内容一致，无需上传`);return}const v=Math.max(s.local.v,s.remote.v)+1,branch=branchBase[active]?`这是基于 v${branchBase[active]} 的新分支版本，不会覆盖其他历史版本。`:'只有文件内容发生变化时才会创建新提交；已有的远端版本不会删除。';modal(`<div class="modal-eyebrow">UPLOAD LOCAL SAVE</div><h2>上传${s.name}本地版本？</h2><p>${branch}</p><div class="modal-summary"><article><span>当前本地</span><b>v${s.local.v} · ${s.local.hash}</b></article><article><span>将创建</span><b>v${v} · 新 commit</b></article></div><div class="modal-actions"><button data-close>取消</button><button class="primary" data-confirm-upload>确认上传</button></div>`)}
    function pull(){const s=save(),v=(history[active]||[]).find(x=>x.v===chosenRemote)||s.remote,items=(history[active]||[]).map(x=>`<button class="history-item ${x.v===v.v?'selected':''}" data-history="${x.v}"><span class="history-dot"></span><span><b>版本 ${x.v} · ${esc(x.n)}</b><small>${esc(x.d)} · ${esc(x.t)} · ${x.h}${x.from?` · 分支自 v${x.from}`:''}</small></span><strong>${x.v===v.v?'当前选择':'选择'}</strong></button>`).join(''),fork=chosenRemote!==null?`选择 v${v.v} 后继续游玩并上传，会产生一条独立的新存档线，v14/v15 等版本仍保留。`:'';modal(`<div class="modal-eyebrow">PULL REMOTE SAVE</div><h2>使用${s.name}远端版本 ${v.v}？</h2><p>默认使用最新远端版本。若要恢复旧存档，请在下面选择；当前本地存档会先保留为恢复点。</p>${fork?`<p class="remote-note">${fork}</p>`:''}<div class="modal-summary"><article><span>当前本地</span><b>v${s.local.v} · ${s.local.hash}</b></article><article><span>准备使用</span><b>v${v.v} · ${v.hash||v.h}</b></article></div><div class="history-list">${items}</div><div class="modal-actions"><button data-close>取消</button><button class="primary" data-confirm-pull>确认拉取</button></div>`)}
    document.addEventListener('click',e=>{const tab=e.target.closest('[data-tab]');if(tab){document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));tab.classList.add('active');active=tab.dataset.tab;box=1;selected.clear();chosenRemote=null;$('#savePage').classList.toggle('active',active!=='warehouse');$('#warehousePage').classList.toggle('active',active==='warehouse');if(active!=='warehouse')render();return}const a=e.target.closest('[data-action]');if(a){const name=a.dataset.action;if(name==='sync')sync();if(name==='upload')upload();if(name==='pull')pull();if(name==='uploadPokemon'){toast(selected.size?`演示：已上传 ${selected.size} 只宝可梦`:'请先选择宝可梦');selected.clear();render()}if(name==='import')toast('演示：已导入一个新的游戏存档');if(name==='settings')settings();if(name==='rebind')rebind();if(name==='createRepo')finishBinding('创建并初始化');if(name==='bindRepo')finishBinding('绑定')}const h=e.target.closest('[data-history]');if(h){chosenRemote=+h.dataset.history;pull()}if(e.target.closest('[data-box]')){box=Math.max(1,Math.min(3,box+(e.target.closest('[data-box]').dataset.box==='next'?1:-1)));selected.clear();render()}if(e.target.closest('[data-close]'))close();if(e.target.closest('[data-confirm-upload]')){const s=save(),v=Math.max(s.local.v,s.remote.v)+1,from=branchBase[active]||null,next={...s.local,v,time:'刚刚',ts:9999};s.local=next;s.remote={...next};history[active].unshift({v,d:next.device,t:'刚刚',ts:next.ts,h:next.hash,n:'本地版本上传',from});branchBase[active]=null;close();render();toast(`上传完成：${s.name}本地与远端已对齐到版本 ${v}`)}if(e.target.closest('[data-confirm-pull]')){const s=save(),v=(history[active]||[]).find(x=>x.v===chosenRemote)||s.remote;s.local={v:v.v||v.version,device:'当前设备',time:'刚刚',ts:v.ts||0,hash:v.h||v.hash};branchBase[active]=v.v;chosenRemote=null;close();render();toast(`恢复完成：${s.name}已切换到版本 ${s.local.v}`)}});$('#modal').onclick=e=>{if(e.target===$('#modal'))close()};render();
  </script>
</body>
</html>
